name: multilingual-stt-tts

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      MAX_ADMITTED_INFERENCE_REQUESTS: ${MAX_ADMITTED_INFERENCE_REQUESTS:-2}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-15728640}
      TEMP_DIRECTORY: /tmp/multilingual-speech-api
      HF_HOME: /opt/model-cache
      HF_HUB_CACHE: /opt/model-cache/hub
      XDG_CACHE_HOME: /opt/model-cache
    ports:
      - "8000:8000"
    volumes:
      - whisper-model-cache:/opt/model-cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  whisper-model-cache:
    name: multilingual-whisper-model-cache
